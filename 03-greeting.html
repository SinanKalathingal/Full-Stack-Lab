<!DOCTYPE html>
<html lang="en">
<head>
    <title>Personal Greeting Alert</title>
</head>
<body>

    <!-- Requirement 1: HTML Form -->
    <label for="nameInput">Enter your name:</label>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button id="greetBtn">Say Hello</button>

    <!-- Requirement 2: JavaScript Linking -->
    <script>
        // Requirement 3: Button Click Event Listener
        document.getElementById("greetBtn").addEventListener("click", function() {
            // Requirement 4: Capturing Data & Alert
            let userName = document.getElementById("nameInput").value;
            alert("Hello, " + userName + "! Welcome to the lab.");
        });
    </script>

</body>
</html>
